spring.application.name=server

# Local secrets come from server/.env (git-ignored). In deployed environments the
# same keys arrive as real environment variables and this import finds nothing.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}
app.cors.allowed-origins=http://localhost:5173

server.port=8080

# Keeps nulls out of responses, so ApiError.fieldErrors is absent unless it is set.
spring.jackson.default-property-inclusion=non_null
