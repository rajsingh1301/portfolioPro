spring.application.name=server

# Local secrets come from server/.env (git-ignored). In deployed environments the
# same keys arrive as real environment variables and this import finds nothing.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}
app.cors.allowed-origins=http://localhost:5173

app.finnhub.base-url=https://finnhub.io/api/v1
app.finnhub.api-key=${FINNHUB_API_KEY}
app.finnhub.timeout-seconds=5

# Chart history. Finnhub's candle endpoint is paid-only, so candles come from Twelve Data
# (free plan: ~8 calls/minute, ~800/day). Blank key = the candles endpoint answers 503.
app.twelvedata.base-url=https://api.twelvedata.com
app.twelvedata.api-key=${TWELVEDATA_API_KEY:}
app.twelvedata.timeout-seconds=8

# Finnhub allows ~60 calls/minute. These TTLs, not the database, are what keep the
# app inside that limit: every viewer of a symbol shares one upstream call.
app.cache.quote-ttl-seconds=15
app.cache.search-ttl-minutes=60
app.cache.candle-ttl-minutes=10

# Pending limit and stop-loss orders are checked against the quote cache this often.
app.orders.poll-enabled=true
app.orders.poll-interval-ms=10000

server.port=8080

# Keeps nulls out of responses, so ApiError.fieldErrors is absent unless it is set.
spring.jackson.default-property-inclusion=non_null
