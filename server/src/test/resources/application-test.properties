# Loaded through @TestPropertySource on @IntegrationTest, so these override the main
# application.properties rather than replacing it -- a file named application.properties
# in test resources would shadow the real one entirely and take the JPA and Flyway
# settings with it.
#
# Tests must not depend on server/.env existing or on what is in it. The datasource
# comes from the MySQL container via @ServiceConnection.
spring.config.import=

JWT_SECRET=test-signing-key-at-least-32-bytes-long-for-hs512-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
JWT_EXPIRY_MINUTES=120

# Overridden per test class by a stub server; never a real Finnhub call.
FINNHUB_API_KEY=test-key
app.finnhub.base-url=http://localhost:1/unused

# Short enough that a test can watch an entry expire without a long sleep.
app.cache.quote-ttl-seconds=2
app.cache.search-ttl-minutes=60

# Overridden per test class by a stub server; never a real Twelve Data call.
app.twelvedata.api-key=test-twelve-key
app.twelvedata.base-url=http://localhost:1/unused
